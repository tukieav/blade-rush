<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:#ff7a4e}</style></head>
<body><canvas id="cover"></canvas><script>
// Bright, title-only CrazyGames cover renderer for Blade Rush.
const q = new URLSearchParams(location.search);
const W = Number(q.get('w') || 1920), H = Number(q.get('h') || 1080);
const portrait = H / W > 1.18, square = !portrait && Math.abs(W - H) < 5;
const c = document.querySelector('#cover'); c.width = W; c.height = H;
const g = c.getContext('2d');
const u = Math.min(W / 1920, H / 1080);
const X = n => n * W / 1920, Y = n => n * H / 1080;
let seed = 73; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

function path(points) { g.beginPath(); points.forEach(([x,y], i) => i ? g.lineTo(x,y) : g.moveTo(x,y)); g.closePath(); }
function ellipse(x,y,rx,ry,fill) { g.fillStyle=fill; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fill(); }
function cloud(x,y,s,a) { g.save(); g.globalAlpha=a; ellipse(x,y,s*.65,s*.25,'#ffe8d0'); ellipse(x+s*.32,y-s*.1,s*.42,s*.22,'#fff4df'); ellipse(x-s*.35,y+s*.03,s*.38,s*.18,'#ffd5c4'); g.restore(); }
function drawBlade(x,y,angle,s) {
  g.save(); g.translate(x,y); g.rotate(angle); g.scale(s,s);
  g.shadowColor='#ffeb80'; g.shadowBlur=28;
  const steel=g.createLinearGradient(-72,0,85,0); steel.addColorStop(0,'#5576ab'); steel.addColorStop(.32,'#f5fcff'); steel.addColorStop(.52,'#bfe8ff'); steel.addColorStop(1,'#3863a6');
  g.fillStyle=steel; path([[88,0],[5,-25],[-88,-18],[-102,0],[-88,18],[5,25]]); g.fill();
  g.shadowBlur=0; g.strokeStyle='#173965'; g.lineWidth=5; g.stroke();
  g.fillStyle='rgba(255,255,255,.72)'; path([[75,-4],[0,-15],[-64,-11],[-77,0],[-64,2],[0,-6]]); g.fill();
  g.fillStyle='#243456'; g.fillRect(-22,-42,32,84); g.strokeStyle='#12213e'; g.lineWidth=5; g.strokeRect(-22,-42,32,84);
  g.fillStyle='#ff4aa5'; g.fillRect(-27,-57,42,15); g.fillStyle='#ffe36f'; g.beginPath(); g.arc(-7,0,10,0,Math.PI*2); g.fill();
  g.restore();
}
function drawTarget(cx,cy,r) {
  g.save(); g.translate(cx,cy); g.shadowColor='#ffed8c'; g.shadowBlur=42;
  const rim=g.createRadialGradient(-r*.25,-r*.3,r*.1,0,0,r*1.12); rim.addColorStop(0,'#fff0a0'); rim.addColorStop(.25,'#ffbb45'); rim.addColorStop(.72,'#e85b36'); rim.addColorStop(1,'#8f2445');
  g.fillStyle=rim; g.beginPath(); g.arc(0,0,r*1.05,0,Math.PI*2); g.fill(); g.shadowBlur=0;
  const wood=g.createRadialGradient(-r*.22,-r*.3,r*.04,0,0,r); wood.addColorStop(0,'#ffe1a0'); wood.addColorStop(.32,'#e89a46'); wood.addColorStop(.72,'#ad542c'); wood.addColorStop(1,'#72362c');
  g.fillStyle=wood; g.beginPath(); g.arc(0,0,r*.92,0,Math.PI*2); g.fill();
  for(let i=1;i<8;i++){g.strokeStyle=`rgba(98,42,22,${.20+(i%2)*.1})`;g.lineWidth=3*u;g.beginPath();g.arc(0,0,r*(.12+i*.1),.2+i*.22,Math.PI*2-.15+i*.1);g.stroke();}
  for(let i=0;i<22;i++){const a=i/22*Math.PI*2;g.strokeStyle='rgba(94,42,20,.24)';g.lineWidth=2*u;g.beginPath();g.moveTo(Math.cos(a)*r*.15,Math.sin(a)*r*.15);g.lineTo(Math.cos(a+.13)*r*.82,Math.sin(a+.13)*r*.82);g.stroke();}
  g.fillStyle='#ffdf55';g.beginPath();g.arc(0,0,r*.2,0,Math.PI*2);g.fill();g.fillStyle='#fa5a50';g.beginPath();g.arc(0,0,r*.1,0,Math.PI*2);g.fill();
  g.strokeStyle='rgba(255,255,255,.72)';g.lineWidth=5*u;g.beginPath();g.arc(-r*.25,-r*.3,r*.54,3.7,5.1);g.stroke();
  g.restore();
}
function title(x,y,maxW,fs) {
  g.save(); g.textAlign='center'; g.textBaseline='middle'; g.font=`900 ${fs}px Arial Black, Impact, sans-serif`; g.lineJoin='round';
  ['BLADE','RUSH'].forEach((word,i)=>{ const yy=y+i*fs*.82; g.shadowColor='rgba(95,22,72,.62)';g.shadowBlur=0;g.shadowOffsetY=fs*.11;g.lineWidth=fs*.15;g.strokeStyle='#6e285f';g.strokeText(word,x,yy,maxW);g.shadowOffsetY=0;g.lineWidth=fs*.07;g.strokeStyle='#fff2ba';g.strokeText(word,x,yy,maxW);const fill=g.createLinearGradient(0,yy-fs,0,yy+fs);fill.addColorStop(0,'#fffaf0');fill.addColorStop(.45,'#ffe36a');fill.addColorStop(1,'#ff8e45');g.fillStyle=fill;g.fillText(word,x,yy,maxW); }); g.restore();
}

const bg=g.createLinearGradient(0,0,W,H); bg.addColorStop(0,'#ec3d9a');bg.addColorStop(.43,'#ff6f4f');bg.addColorStop(.75,'#ffad45');bg.addColorStop(1,'#ffe27c');g.fillStyle=bg;g.fillRect(0,0,W,H);
const sun=g.createRadialGradient(X(.72),Y(.22),0,X(.72),Y(.22),Math.max(W,H)*.7);sun.addColorStop(0,'rgba(255,255,220,.9)');sun.addColorStop(.25,'rgba(255,220,135,.46)');sun.addColorStop(1,'rgba(255,110,80,0)');g.fillStyle=sun;g.fillRect(0,0,W,H);
for(let i=0;i<16;i++) cloud(rnd()*W, Y(.06+rnd()*.46), X(.045+rnd()*.07), .18+rnd()*.18);
g.save();g.globalCompositeOperation='screen'; for(let i=0;i<8;i++){const x=X(.1+i*.13);const beam=g.createLinearGradient(x,0,x+X(.12),H);beam.addColorStop(0,'rgba(255,252,202,.30)');beam.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=beam;path([[x-X(.022),0],[x+X(.022),0],[x+X(.18),H],[x-X(.12),H]]);g.fill();}g.restore();
g.fillStyle='rgba(104,40,87,.30)';path([[0,Y(.78)],[X(.11),Y(.67)],[X(.23),Y(.74)],[X(.37),Y(.64)],[X(.55),Y(.75)],[X(.72),Y(.61)],[X(.88),Y(.71)],[W,Y(.61)],[W,H],[0,H]]);g.fill();
g.fillStyle='rgba(130,47,73,.22)';for(let i=0;i<18;i++)ellipse(X(i/17),Y(.83+(i%3)*.015),X(.07),Y(.035),'rgba(126,48,75,.24)');

let tx,ty,tr,bx,by,ba,bs,ttx,tty,tfs;
if(portrait){tx=W*.52;ty=H*.42;tr=W*.34;bx=W*.40;by=H*.67;ba=-.48;bs=Math.min(W,H)/420;ttx=W*.5;tty=H*.77;tfs=W*.16;}
else if(square){tx=W*.54;ty=H*.35;tr=W*.31;bx=W*.33;by=H*.59;ba=-.56;bs=W/430;ttx=W*.5;tty=H*.72;tfs=W*.145;}
else{tx=W*.72;ty=H*.51;tr=H*.37;bx=W*.44;by=H*.62;ba=-.55;bs=H/500;ttx=W*.24;tty=H*.34;tfs=H*.145;}
g.save();g.strokeStyle='rgba(255,247,190,.88)';g.lineCap='round';for(let i=0;i<4;i++){g.lineWidth=(13-i*2)*u;g.globalAlpha=.65-i*.12;g.beginPath();g.arc(tx-tr*.9,ty+tr*.65,tr*(.75+i*.12),3.4,4.75);g.stroke();}g.restore();
drawTarget(tx,ty,tr);
for(const a of [-2.32,-.1,1.35,2.7]) drawBlade(tx+Math.cos(a)*tr*.95,ty+Math.sin(a)*tr*.95,a+.15,.64*u);
drawBlade(bx,by,ba,bs);
title(ttx,tty,portrait?W*.9:W*.42,tfs);
document.title='ready';
</script></body></html>
